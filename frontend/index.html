<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion de Tickets</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
    input, textarea, select, button { padding: 0.5rem; font-size: 1rem; }
    .ticket { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; }
    .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Support — Tickets</h1>

  <form id="ticket-form">
    <input id="titre" type="text" placeholder="Titre de l'incident" required />
    <textarea id="description" rows="3" placeholder="Description" required></textarea>
    <button type="submit">Créer le ticket</button>
  </form>

  <div id="tickets-list"></div>

  <script src="config.js"></script>
  <script>
    const API_URL = window.API_URL || "http://localhost:3000";

    async function chargerTickets() {
      const res = await fetch(`${API_URL}/api/tickets`);
      const tickets = await res.json();
      const container = document.getElementById("tickets-list");
      container.innerHTML = "";

      for (const t of tickets) {
        const div = document.createElement("div");
        div.className = "ticket";
        div.innerHTML = `
          <strong>#${t.id} — ${escapeHtml(t.titre)}</strong>
          <p>${escapeHtml(t.description)}</p>
          <div class="meta">
            <span>Statut actuel : <strong>${escapeHtml(t.statut)}</strong></span>
            <select onchange="changerStatut(${t.id}, this.value)">
              <option value="Ouvert" ${t.statut === "Ouvert" ? "selected" : ""}>Ouvert</option>
              <option value="En cours" ${t.statut === "En cours" ? "selected" : ""}>En cours</option>
              <option value="Résolu" ${t.statut === "Résolu" ? "selected" : ""}>Résolu</option>
            </select>
          </div>
        `;
        container.appendChild(div);
      }
    }

    async function changerStatut(id, statut) {
      await fetch(`${API_URL}/api/tickets/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ statut }),
      });
      chargerTickets();
    }

    document.getElementById("ticket-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const titre = document.getElementById("titre").value;
      const description = document.getElementById("description").value;

      await fetch(`${API_URL}/api/tickets`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titre, description }),
      });

      e.target.reset();
      chargerTickets();
    });

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    chargerTickets();
  </script>
</body>
</html>
